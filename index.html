<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>术曲榜 - Vocaloid Rank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 🚨 全局错误报警器：只要页面卡住/报错，立刻弹窗
        window.onerror = function(msg, url, line, col, error) {
            alert("网页报错啦！\n错误信息: " + msg + "\n行号: " + line);
            return false;
        };
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        .accent { color: #39C5BB; }
        .btn-accent { background-color: #39C5BB; color: #0f172a; font-weight: bold; }
        .btn-accent:hover { background-color: #2da89f; }
        .tab-active { border-bottom: 3px solid #39C5BB; color: #39C5BB; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-20">

    <!-- 登录界面（未登录时显示） -->
    <div id="auth-screen" class="fixed inset-0 bg-[#0f172a] z-[100] flex flex-col items-center justify-center p-6">
        <h1 class="text-3xl font-bold accent mb-2">🎵 术曲榜</h1>
        <p class="text-gray-400 text-sm mb-8">登录 / 注册</p>
        
        <div class="w-full max-w-xs">
            <div class="flex flex-col items-center mb-6">
                <div class="w-20 h-20 rounded-full bg-gray-700 border-2 border-dashed border-gray-500 flex items-center justify-center overflow-hidden relative cursor-pointer" onclick="document.getElementById('avatar-input').click()">
                    <img id="avatar-preview" src="https://ui-avatars.com/api/?name=User&background=39C5BB&color=fff" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center text-xs opacity-0 hover:opacity-100">点击上传</div>
                </div>
                <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="previewAvatar(event)">
                <span class="text-[10px] text-gray-500 mt-2">点击上传头像（可选）</span>
            </div>

            <input type="tel" id="phone" placeholder="手机号" class="w-full bg-gray-800 rounded p-3 mb-3 text-white outline-none border border-gray-600 focus:border-[#39C5BB]">
            <input type="password" id="password" placeholder="密码 (至少6位)" class="w-full bg-gray-800 rounded p-3 mb-6 text-white outline-none border border-gray-600 focus:border-[#39C5BB]">
            
            <button id="auth-btn" class="w-full btn-accent py-3 rounded-lg mb-3">登录 / 注册</button>
            <p class="text-xs text-gray-500 text-center">第一次输入手机号和密码将自动注册</p>
        </div>
    </div>

    <!-- 主应用界面（登录后显示） -->
    <div id="app-container" class="hidden">
        <!-- 顶部导航 -->
        <header class="p-4 flex justify-between items-center border-b border-gray-700 sticky top-0 bg-[#0f172a] z-10">
            <h1 class="text-xl font-bold accent">🎵 术曲榜</h1>
            <div class="flex items-center gap-3">
                <img id="user-avatar" src="" class="w-8 h-8 rounded-full bg-gray-700 object-cover">
                <button onclick="logout()" class="text-xs text-red-400 border border-red-400 px-2 py-1 rounded">退出</button>
            </div>
        </header>

        <!-- 视图1：首页 (卡片网格) -->
        <main id="view-home" class="p-4">
            <h2 class="text-lg font-bold mb-4">热门推荐</h2>
            <div id="home-grid" class="grid grid-cols-2 gap-3"></div>
        </main>

        <!-- 视图2：排行榜 -->
        <main id="view-rank" class="hidden">
            <div class="flex justify-center space-x-8 mt-2 border-b border-gray-700 pb-2">
                <button onclick="switchTab('week')" id="tab-week" class="tab-active pb-2 px-2">周榜</button>
                <button onclick="switchTab('month')" id="tab-month" class="pb-2 px-2 text-gray-400">月榜</button>
                <button onclick="switchTab('all')" id="tab-all" class="pb-2 px-2 text-gray-400">总榜</button>
            </div>
            <div id="rank-list" class="p-4 space-y-3"></div>
        </main>

        <!-- 底部导航栏 -->
        <nav class="fixed bottom-0 w-full bg-[#0f172a] border-t border-gray-700 flex justify-around items-center h-16 z-50">
            <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center text-[#39C5BB] w-1/2">
                <span class="text-lg">🏠</span>
                <span class="text-[10px] mt-1">首页</span>
            </button>
            <button onclick="switchView('rank')" id="nav-rank" class="flex flex-col items-center text-gray-500 w-1/2">
                <span class="text-lg">🏆</span>
                <span class="text-[10px] mt-1">排行榜</span>
            </button>
        </nav>
    </div>

    <!-- 投票弹窗 -->
    <div id="vote-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[110] p-4">
        <div class="bg-gray-800 rounded-xl p-6 w-full max-w-sm text-center">
            <h2 class="text-lg font-bold mb-2">为歌曲投票</h2>
            <p id="vote-song-title" class="text-sm text-gray-400 mb-4"></p>
            <div class="flex items-center justify-center space-x-4 mb-4">
                <button onclick="adjustVote(-1)" class="w-10 h-10 rounded-full bg-gray-700 text-xl font-bold">-</button>
                <span id="vote-amount" class="text-2xl font-bold accent">1</span>
                <button onclick="adjustVote(1)" class="w-10 h-10 rounded-full bg-gray-700 text-xl font-bold">+</button>
            </div>
            <button onclick="submitVote()" class="w-full btn-accent py-2 rounded mb-2">确认投票</button>
            <button onclick="hideVote()" class="w-full text-gray-400 text-sm py-1">取消</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bqhrrqcflobfqgayrrei.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_744GEcKjPqHvWI2Zd484LA_LJ-mjPBG';
        
        if (typeof supabase === 'undefined') {
            alert("Supabase 库加载失败，请检查网络或刷新页面！");
        }
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentTab = 'week';
        let selectedSongId = null;
        let currentVoteAmount = 1;
        let allSongs = [];
        let allVotes = [];

        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('avatar-preview').src = e.target.result;
                reader.readAsDataURL(file);
            }
        }

        // 绑定按钮点击事件（防手机端失效）
        document.getElementById('auth-btn').addEventListener('click', async function() {
            const btn = this;
            btn.innerText = '处理中...';
            btn.disabled = true;

            try {
                const phone = document.getElementById('phone').value.trim();
                const password = document.getElementById('password').value.trim();
                const avatarInput = document.getElementById('avatar-input');
                
                if (!phone || !password) throw new Error('请输入手机号和密码');
                if (password.length < 6) throw new Error('密码至少6位');

                const fakeEmail = `${phone}@phone.com`;
                
                // 尝试登录
                let { data, error } = await supabaseClient.auth.signInWithPassword({ email: fakeEmail, password });
                
                if (error) {
                    // 登录失败，走注册流程
                    let avatarUrl = null;
                    if (avatarInput.files[0]) {
                        const file = avatarInput.files[0];
                        const fileExt = file.name.split('.').pop();
                        const fileName = `${Date.now()}.${fileExt}`;
                        
                        // 上传到 '头像' 桶（对应你之前建的桶名）
                        const { data: uploadData, error: uploadError } = await supabaseClient.storage.from('头像').upload(fileName, file);
                        if (uploadError) throw new Error('头像上传失败: ' + uploadError.message);
                        
                        const { data: urlData } = supabaseClient.storage.from('头像').getPublicUrl(fileName);
                        avatarUrl = urlData.publicUrl;
                    }

                    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ 
                        email: fakeEmail, 
                        password,
                        options: { data: { avatar_url: avatarUrl } }
                    });
                    
                    if (signUpError) throw new Error('注册失败: ' + signUpError.message);
                    currentUser = signUpData.user;
                    alert('注册成功！');
                } else {
                    currentUser = data.user;
                    alert('登录成功！');
                }
                
                // 进入主界面
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                const finalAvatar = currentUser.user_metadata?.avatar_url || 'https://ui-avatars.com/api/?name=User&background=39C5BB&color=fff';
                document.getElementById('user-avatar').src = finalAvatar;
                
                await fetchData();
                
            } catch (err) {
                alert("操作失败：\n" + err.message);
            } finally {
                btn.innerText = '登录 / 注册';
                btn.disabled = false;
            }
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        function switchView(view) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-rank').classList.add('hidden');
            document.getElementById('nav-home').className = "flex flex-col items-center text-gray-500 w-1/2";
            document.getElementById('nav-rank').className = "flex flex-col items-center text-gray-500 w-1/2";
            
            if (view === 'home') {
                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('nav-home').className = "flex flex-col items-center text-[#39C5BB] w-1/2";
                renderHome();
            } else {
                document.getElementById('view-rank').classList.remove('hidden');
                document.getElementById('nav-rank').className = "flex flex-col items-center text-[#39C5BB] w-1/2";
                renderRank();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('button[id^="tab-"]').forEach(btn => {
                btn.classList.remove('tab-active', 'accent');
                btn.classList.add('text-gray-400');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('tab-active', 'accent');
            activeBtn.classList.remove('text-gray-400');
            renderRank();
        }

        async function fetchData() {
            try {
                const { data: songs, error: songError } = await supabaseClient.from('songs').select('*').order('created_at', { ascending: false });
                if (songError) throw songError;
                allSongs = songs || [];

                const { data: votes, error: voteError } = await supabaseClient.from('votes').select('song_id, vote_count, created_at');
                if (voteError) throw voteError;
                allVotes = votes || [];

                renderHome();
                renderRank();
            } catch (err) {
                alert('数据加载失败，请检查 Supabase 数据库中是否有 songs 和 votes 表。\n错误: ' + err.message);
            }
        }

        function renderHome() {
            const grid = document.getElementById('home-grid');
            if (allSongs.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center text-gray-500 text-sm mt-10">暂无歌曲，请去 Supabase 添加歌曲</p>';
                return;
            }
            grid.innerHTML = allSongs.map(song => `
                <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg flex flex-col">
                    <img src="${song.cover_url || 'https://via.placeholder.com/150'}" class="w-full h-32 object-cover bg-gray-700" alt="cover">
                    <div class="p-2 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-sm truncate">${song.title}</h3>
                            <p class="text-[10px] text-gray-400 truncate mt-1">${song.producer} / ${song.vocals}</p>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-[10px] text-gray-500">${song.platform}</span>
                            <button onclick="openVote('${song.id}', '${song.title}')" class="text-[10px] btn-accent px-2 py-1 rounded">投票</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderRank() {
            const listEl = document.getElementById('rank-list');
            let timeFilter = null;
            const now = new Date();
            if (currentTab === 'week') {
                const day = now.getDay() || 7;
                const monday = new Date(now);
                monday.setDate(now.getDate() - day + 1);
                monday.setHours(0,0,0,0);
                timeFilter = monday.getTime();
            } else if (currentTab === 'month') {
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                timeFilter = firstDay.getTime();
            }

            const voteMap = {};
            allVotes.forEach(v => {
                if (!timeFilter || new Date(v.created_at).getTime() >= timeFilter) {
                    voteMap[v.song_id] = (voteMap[v.song_id] || 0) + v.vote_count;
                }
            });

            const sortedSongs = [...allSongs].sort((a, b) => (voteMap[b.id] || 0) - (voteMap[a.id] || 0));

            if (sortedSongs.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-500 text-sm mt-10">当前榜单暂无歌曲</p>';
                return;
            }

            listEl.innerHTML = sortedSongs.map((song, index) => {
                const voteCount = voteMap[song.id] || 0;
                return `
                <div class="bg-gray-800 rounded-xl p-3 flex gap-3 items-center">
                    <div class="text-xl font-bold w-6 text-center ${index < 3 ? 'accent' : 'text-gray-500'}">${index + 1}</div>
                    <img src="${song.cover_url || 'https://via.placeholder.com/60'}" class="w-14 h-14 rounded object-cover bg-gray-700">
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-sm truncate">${song.title}</h3>
                        <p class="text-[10px] text-gray-400 truncate">${song.producer} / ${song.vocals}</p>
                        <p class="text-[10px] text-gray-500 mt-1">来源: ${song.platform}</p>
                    </div>
                    <div class="text-right">
                        <div class="text-md font-bold accent">${voteCount} 票</div>
                        <button onclick="openVote('${song.id}', '${song.title}')" class="text-[10px] btn-accent px-2 py-1 rounded mt-1">投票</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function fetchVoteCount() {
            if (!currentUser) return 0;
            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);
            const { data } = await supabaseClient.from('votes').select('vote_count').eq('user_id', currentUser.id).gte('created_at', todayStart.toISOString());
            let used = 0;
            if (data) data.forEach(v => used += v.vote_count);
            return 10 - used;
        }

        function openVote(songId, title) {
            if (!currentUser) return;
            selectedSongId = songId;
            currentVoteAmount = 1;
            document.getElementById('vote-song-title').innerText = title;
            document.getElementById('vote-amount').innerText = currentVoteAmount;
            document.getElementById('vote-modal').classList.remove('hidden');
        }

        function hideVote() { document.getElementById('vote-modal').classList.add('hidden'); }
        function adjustVote(amount) {
            currentVoteAmount += amount;
            if (currentVoteAmount < 1) currentVoteAmount = 1;
            if (currentVoteAmount > 10) currentVoteAmount = 10;
            document.getElementById('vote-amount').innerText = currentVoteAmount;
        }

        async function submitVote() {
            if (!currentUser) return;
            const remaining = await fetchVoteCount();
            if (currentVoteAmount > remaining) return alert(`你今天的票数不够啦！剩余: ${remaining} 票`);

            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);
            const { data: existing } = await supabaseClient.from('votes').select('id, vote_count').eq('user_id', currentUser.id).eq('song_id', selectedSongId).gte('created_at', todayStart.toISOString()).single();

            if (existing) {
                await supabaseClient.from('votes').update({ vote_count: existing.vote_count + currentVoteAmount }).eq('id', existing.id);
            } else {
                await supabaseClient.from('votes').insert([{ user_id: currentUser.id, song_id: selectedSongId, vote_count: currentVoteAmount }]);
            }
            hideVote();
            alert('投票成功！');
            fetchData();
        }

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('user-avatar').src = user.user_metadata?.avatar_url || 'https://ui-avatars.com/api/?name=User&background=39C5BB&color=fff';
                await fetchData();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        }
        init();
    </script>
</body>
</html>
