<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate"> <!-- 阻止浏览器翻译导致乱码 -->
    <title>术曲榜 - Vocaloid Rank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .accent { color: #39C5BB; }
        .btn-accent { background-color: #39C5BB; color: #0f172a; font-weight: bold; }
        .btn-accent:hover { background-color: #2da89f; }
        .tab-active { border-bottom: 3px solid #39C5BB; color: #39C5BB; }
    </style>
</head>
<body class="pb-24">

    <!-- 顶部导航 -->
    <header class="p-4 flex justify-between items-center border-b border-gray-700 sticky top-0 bg-[#0f172a] z-10">
        <h1 class="text-xl font-bold accent">🎵 术曲榜</h1>
        <div id="auth-area">
            <button onclick="showLogin()" class="text-sm px-3 py-1 border border-[#39C5BB] rounded text-[#39C5BB]">登录</button>
        </div>
    </header>

    <!-- 用户信息栏（登录后显示） -->
    <div id="user-info" class="hidden bg-gray-800 p-3 mx-4 mt-3 rounded-lg flex justify-between items-center text-sm">
        <span>剩余票数：<strong id="vote-count" class="accent">10</strong> / 10</span>
        <button onclick="logout()" class="text-red-400 text-xs">退出</button>
    </div>

    <!-- 榜单切换 -->
    <div class="flex justify-center space-x-8 mt-4 border-b border-gray-700 pb-2">
        <button onclick="switchTab('week')" id="tab-week" class="tab-active pb-2 px-2">周榜</button>
        <button onclick="switchTab('month')" id="tab-month" class="pb-2 px-2 text-gray-400">月榜</button>
        <button onclick="switchTab('all')" id="tab-all" class="pb-2 px-2 text-gray-400">总榜</button>
    </div>

    <!-- 歌曲列表 -->
    <main id="song-list" class="p-4 space-y-4">
        <p class="text-center text-gray-500 text-sm mt-10">加载中...</p>
    </main>

    <!-- 登录弹窗 -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 rounded-xl p-6 w-full max-w-sm">
            <h2 class="text-lg font-bold mb-4 text-center">登录</h2>
            <input type="tel" id="phone" placeholder="手机号" class="w-full bg-gray-700 rounded p-2 mb-3 text-white outline-none focus:border-[#39C5BB] border border-gray-600">
            <input type="password" id="password" placeholder="密码" class="w-full bg-gray-700 rounded p-2 mb-4 text-white outline-none focus:border-[#39C5BB] border border-gray-600">
            <button onclick="login()" class="w-full btn-accent py-2 rounded mb-2">登录 / 注册</button>
            <button onclick="hideLogin()" class="w-full text-gray-400 text-sm py-1">取消</button>
        </div>
    </div>

    <!-- 投票弹窗（可重复投票） -->
    <div id="vote-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 rounded-xl p-6 w-full max-w-sm text-center">
            <h2 class="text-lg font-bold mb-2">为歌曲投票</h2>
            <p id="vote-song-title" class="text-sm text-gray-400 mb-4"></p>
            <div class="flex items-center justify-center space-x-4 mb-4">
                <button onclick="adjustVote(-1)" class="w-10 h-10 rounded-full bg-gray-700 text-xl font-bold">-</button>
                <span id="vote-amount" class="text-2xl font-bold accent">1</span>
                <button onclick="adjustVote(1)" class="w-10 h-10 rounded-full bg-gray-700 text-xl font-bold">+</button>
            </div>
            <button onclick="submitVote()" class="w-full btn-accent py-2 rounded mb-2">确认投票</button>
            <button onclick="hideVote()" class="w-full text-gray-400 text-sm py-1">取消</button>
        </div>
    </div>

    <script>
        // ================= 配置区（你的真实数据已填入） =================
        const SUPABASE_URL = 'https://bqhrrqcflobfqgayrrei.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_744GEcKjPqHvWI2Zd484LA_LJ-mjPBG';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // ======================================================================

        let currentUser = null;
        let currentTab = 'week';
        let selectedSongId = null;
        let selectedSongTitle = '';
        let currentVoteAmount = 1;

        // --- 登录逻辑（手机号+密码） ---
        // 原理：将手机号拼接为虚拟邮箱（例：13912345678@phone.com）传给 Supabase Auth
        function showLogin() { document.getElementById('login-modal').classList.remove('hidden'); }
        function hideLogin() { document.getElementById('login-modal').classList.add('hidden'); }

        async function login() {
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!phone || !password) return alert('请输入手机号和密码');

            const fakeEmail = `${phone}@phone.com`; // 绕过短信验证的核心逻辑
            
            // 尝试登录，失败则注册
            let { data, error } = await supabase.auth.signInWithPassword({ email: fakeEmail, password });
            if (error) {
                const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email: fakeEmail, password });
                if (signUpError) return alert('注册失败: ' + signUpError.message);
                currentUser = signUpData.user;
                alert('注册并登录成功！');
            } else {
                currentUser = data.user;
            }
            hideLogin();
            checkUser();
            loadSongs();
        }

        async function logout() {
            await supabase.auth.signOut();
            currentUser = null;
            checkUser();
            loadSongs();
        }

        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('auth-area').innerHTML = `<span class="text-sm text-[#39C5BB]">已登录</span>`;
                await fetchVoteCount();
            } else {
                currentUser = null;
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('auth-area').innerHTML = `<button onclick="showLogin()" class="text-sm px-3 py-1 border border-[#39C5BB] rounded text-[#39C5BB]">登录</button>`;
            }
        }

        // 获取今日已投票数
        async function fetchVoteCount() {
            if (!currentUser) return 0;
            const today = new Date().toISOString().split('T')[0];
            const { data, error } = await supabase
                .from('votes')
                .select('vote_count')
                .eq('user_id', currentUser.id)
                .gte('created_at', today);
            
            let used = 0;
            if (data) {
                data.forEach(v => used += v.vote_count);
            }
            document.getElementById('vote-count').innerText = 10 - used;
            return 10 - used;
        }

        // --- 榜单切换 ---
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('button[id^="tab-"]').forEach(btn => {
                btn.classList.remove('tab-active', 'accent');
                btn.classList.add('text-gray-400');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('tab-active', 'accent');
            activeBtn.classList.remove('text-gray-400');
            loadSongs();
        }

        // --- 加载歌曲与投票数据 ---
        async function loadSongs() {
            const listEl = document.getElementById('song-list');
            listEl.innerHTML = '<p class="text-center text-gray-500 text-sm mt-10">加载中...</p>';

            // 计算时间范围
            let timeFilter = '';
            const now = new Date();
            if (currentTab === 'week') {
                const day = now.getDay() || 7; // 周一为1
                const monday = new Date(now);
                monday.setDate(now.getDate() - day + 1);
                monday.setHours(0,0,0,0);
                timeFilter = monday.toISOString();
            } else if (currentTab === 'month') {
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                timeFilter = firstDay.toISOString();
            }

            // 获取歌曲列表
            const { data: songs, error: songError } = await supabase.from('songs').select('*');
            if (songError) return listEl.innerHTML = `<p class="text-red-500 text-center">加载失败: ${songError.message}</p>`;
            if (!songs || songs.length === 0) return listEl.innerHTML = '<p class="text-center text-gray-500 text-sm mt-10">暂无歌曲，请管理员在 Supabase 后台添加</p>';

            // 获取投票数据
            let voteQuery = supabase.from('votes').select('song_id, vote_count');
            if (timeFilter) voteQuery = voteQuery.gte('created_at', timeFilter);
            const { data: votes } = await voteQuery;

            // 聚合票数
            const voteMap = {};
            if (votes) {
                votes.forEach(v => {
                    voteMap[v.song_id] = (voteMap[v.song_id] || 0) + v.vote_count;
                });
            }

            // 排序
            songs.sort((a, b) => (voteMap[b.id] || 0) - (voteMap[a.id] || 0));

            // 渲染 HTML
            listEl.innerHTML = songs.map((song, index) => {
                const voteCount = voteMap[song.id] || 0;
                return `
                <div class="bg-gray-800 rounded-xl p-4 flex gap-4 items-center">
                    <div class="text-2xl font-bold w-8 text-center ${index < 3 ? 'accent' : 'text-gray-500'}">${index + 1}</div>
                    <img src="${song.cover_url || 'https://via.placeholder.com/60'}" class="w-16 h-16 rounded object-cover bg-gray-700" alt="cover">
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-md truncate">${song.title}</h3>
                        <p class="text-xs text-gray-400 truncate">${song.producer} / ${song.vocals}</p>
                        <p class="text-[10px] text-gray-500 mt-1">来源: ${song.platform} | <a href="${song.link}" target="_blank" class="text-blue-400">链接</a></p>
                    </div>
                    <div class="text-right">
                        <div class="text-lg font-bold accent">${voteCount}</div>
                        <button onclick="openVote('${song.id}', '${song.title}')" class="text-xs btn-accent px-3 py-1 rounded mt-1">投票</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // --- 投票逻辑 ---
        function openVote(songId, title) {
            if (!currentUser) return showLogin();
            selectedSongId = songId;
            selectedSongTitle = title;
            currentVoteAmount = 1;
            document.getElementById('vote-song-title').innerText = title;
            document.getElementById('vote-amount').innerText = currentVoteAmount;
            document.getElementById('vote-modal').classList.remove('hidden');
        }

        function hideVote() { document.getElementById('vote-modal').classList.add('hidden'); }
        function adjustVote(amount) {
            currentVoteAmount += amount;
            if (currentVoteAmount < 1) currentVoteAmount = 1;
            if (currentVoteAmount > 10) currentVoteAmount = 10;
            document.getElementById('vote-amount').innerText = currentVoteAmount;
        }

        async function submitVote() {
            if (!currentUser) return;
            const remaining = await fetchVoteCount();
            if (currentVoteAmount > remaining) {
                return alert(`你今天的票数不够啦！剩余: ${remaining} 票`);
            }

            // 检查今日是否已给同一首歌投过票
            const today = new Date().toISOString().split('T')[0];
            const { data: existing } = await supabase
                .from('votes')
                .select('id, vote_count')
                .eq('user_id', currentUser.id)
                .eq('song_id', selectedSongId)
                .gte('created_at', today)
                .single();

            if (existing) {
                // 更新已有记录
                await supabase.from('votes')
                    .update({ vote_count: existing.vote_count + currentVoteAmount })
                    .eq('id', existing.id);
            } else {
                // 插入新记录
                await supabase.from('votes')
                    .insert([{ user_id: currentUser.id, song_id: selectedSongId, vote_count: currentVoteAmount }]);
            }

            hideVote();
            alert('投票成功！');
            fetchVoteCount();
            loadSongs();
        }

        // --- 初始化 ---
        async function init() {
            await checkUser();
            await loadSongs();
        }
        init();
    </script>
</body>
</html>
